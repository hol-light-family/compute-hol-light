name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # check PRs
  pull_request:
    branches:
      - master

  # check pushes
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # The blocking checks. The HOL Light revision they build against is pinned in
  # build-and-test.yml. Both Ubuntu and MacOS are checked.
  pinned-linux:
    name: hol-light (pinned), Linux
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'ubuntu-24.04'

  pinned-macos:
    name: hol-light (pinned), MacOS
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'macos-latest'
